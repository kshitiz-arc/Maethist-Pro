# Builds the container image and publishes it to GitHub Packages
# (ghcr.io/kshitiz-arc/maethist-pro) whenever a GitHub release is published,
# tagged with the release's version and "latest". It can also be run by hand
# from the Actions tab.
#
# The image is started and checked (health check and the editor page) before
# anything is pushed, so a release can never publish an image that does not
# boot. New packages on a personal account start private; this workflow does
# not change that.
name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/maethist-pro

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: maethist:smoke

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8000:8000 -e SECRET_KEY=smoke-test-only maethist:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"version":"${{ steps.version.outputs.value }}"'
          curl -fsS http://127.0.0.1:8000/write | grep -q '<canvas id="drawingCanvas"'
          # Production without a secret must refuse to start.
          if docker run --rm maethist:smoke python -c "import app" 2>/dev/null; then
            echo "started without SECRET_KEY"; exit 1
          fi
          docker logs smoke | tail -20
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=MAETHIST
            org.opencontainers.image.description=A browser workspace for studying from your own material.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=LicenseRef-Proprietary

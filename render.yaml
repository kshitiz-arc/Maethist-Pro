# Render blueprint for MAETHIST. In the Render dashboard choose
# "New > Blueprint" and point it at this repository.
services:
  - type: web
    name: inkyscib
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --config gunicorn.conf.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: INKYSCIB_ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      # Set this to your public address, for example https://inkyscib.com.
      # It drives canonical URLs, the sitemap and social cards.
      - key: SITE_ORIGIN
        sync: false
      # Saved video moments, cut at the source's own resolution up to 1080p
      # (quick to decode, even on the free plan). 2160 brings back 4K, which
      # needs real CPU: on the free plan (0.1 CPU) the first 4K frame can take
      # a minute. Set YOUTUBE_FULL_FRAMES to "false" to use only YouTube's
      # low-resolution preview images.
      - key: YOUTUBE_FULL_FRAMES
        value: "true"
      - key: YOUTUBE_FRAME_MAX_HEIGHT
        value: "1080"
      - key: YOUTUBE_FRAME_CONCURRENCY
        value: "2"
      # Remote off switch for the offline app shell. Set to "off" and redeploy
      # if a release ever ships a broken service worker.
      - key: OFFLINE_SHELL
        value: "on"
      # The address shown on the privacy and terms pages for rights requests.
      # Required before launch; until it is set they show a placeholder.
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Password for /stats, the visit counter (HTTP Basic; any username).
      # Without it, /stats does not exist.
      - key: STATS_TOKEN
        sync: false
      # Optional: Google Search Console HTML-tag verification.
      - key: SEARCH_CONSOLE_TOKEN
        sync: false

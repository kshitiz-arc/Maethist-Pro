<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5a5aff; }
    a:hover { color: #4444d6; }

    .stage {
      position: relative;
      width: 1040px;
      height: 660px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--txt);
    }

    .stage[data-theme="dark"] {
      --bg-a: #0c0f15;
      --bg-b: #06080d;
      --halo: rgba(86, 101, 146, 0.18);
      --dot: rgba(255, 255, 255, 0.13);
      --chrome: rgba(20, 22, 30, 0.76);
      --chrome-brd: rgba(255, 255, 255, 0.10);
      --chrome-hi: rgba(255, 255, 255, 0.14);
      --txt: #f8fafc;
      --muted: rgba(248, 250, 252, 0.66);
      --hover: rgba(255, 255, 255, 0.07);
      --rule: rgba(255, 255, 255, 0.1);
      --ink: #f1f5f9;
      --ink-swatch: #f8fafc;
      --accent-ui: #a5a5ff;
      --knob-brd: rgba(0, 0, 0, 0.2);
      --paper: rgba(255, 255, 255, 0.05);
      --drop: 0 22px 55px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    .stage[data-theme="light"] {
      --bg-a: #f5f7fb;
      --bg-b: #e8edf5;
      --halo: rgba(157, 176, 212, 0.38);
      --dot: rgba(15, 23, 42, 0.11);
      --chrome: rgba(255, 255, 255, 0.86);
      --chrome-brd: rgba(15, 23, 42, 0.08);
      --chrome-hi: rgba(255, 255, 255, 0.92);
      --txt: #0f172a;
      --muted: rgba(15, 23, 42, 0.74);
      --hover: rgba(15, 23, 42, 0.05);
      --rule: rgba(15, 23, 42, 0.09);
      --ink: #1e293b;
      --ink-swatch: #0f172a;
      --accent-ui: #3d3dc4;
      --knob-brd: rgba(15, 23, 42, 0.22);
      --paper: #ffffff;
      --drop: 0 22px 48px rgba(100, 116, 145, 0.22), 0 4px 12px rgba(100, 116, 145, 0.12);
    }

    .canvas {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top center, var(--halo), transparent 34%),
        linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
    }

    .dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.36;
    }

    .glass {
      background: var(--chrome);
      border: 1px solid var(--chrome-brd);
      backdrop-filter: blur(22px) saturate(160%);
      box-shadow: var(--drop), inset 0 1px 0 var(--chrome-hi);
    }

    /* slim top bar */
    .top {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 8px 0 16px;
      border-radius: 18px;
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .crumbs .dim { color: var(--muted); font-weight: 600; }

    .top-actions { display: flex; align-items: center; gap: 3px; }

    .ghost {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 13px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .ghost:hover { background: var(--hover); }
    .ghost svg { width: 20px; height: 20px; display: block; }

    .cta {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      margin-left: 8px;
      padding: 0 18px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(180deg, #7373ff, #4f4fe6);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(90, 90, 255, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    /* vertical tool rail */
    .rail {
      position: absolute;
      top: 96px;
      left: 18px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 8px;
      border-radius: 20px;
    }

    .tool {
      position: relative;
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .tool:hover { background: var(--hover); }
    .tool svg { width: 22px; height: 22px; display: block; }

    .tool.is-active {
      background: rgba(90, 90, 255, 0.18);
      color: var(--accent-ui);
    }

    .tool.is-active::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 50%;
      width: 3px;
      height: 22px;
      margin-top: -11px;
      border-radius: 0 3px 3px 0;
      background: #5a5aff;
      box-shadow: 0 0 12px rgba(90, 90, 255, 0.8);
    }

    .rail-rule { height: 1px; margin: 6px 4px; background: var(--rule); }

    /* contextual panel — always open, never a popover */
    .panel {
      position: absolute;
      top: 96px;
      left: 92px;
      width: 300px;
      padding: 16px;
      border-radius: 20px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 13px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--rule);
    }

    .panel-title { font-size: 0.98rem; font-weight: 800; letter-spacing: -0.015em; }

    .kbd {
      padding: 4px 8px;
      border-radius: 7px;
      background: var(--hover);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .label {
      margin-bottom: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section + .section { margin-top: 14px; }

    .swatches { display: flex; gap: 0; }

    .sw {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .sw i {
      display: block;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sw:hover i { transform: scale(1.14); }
    .sw.on { background: rgba(90, 90, 255, 0.14); }
    .sw.on i { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2), 0 0 0 2px #5a5aff; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

    .val { color: var(--muted); font-size: 0.8rem; font-weight: 700; }

    .sizerow { display: flex; align-items: center; height: 44px; }

    .track {
      position: relative;
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--hover);
    }

    .fill {
      position: absolute;
      inset: 0 55% 0 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #6f6fff, #5a5aff);
    }

    .knob {
      position: absolute;
      top: 50%;
      left: 45%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--knob-brd);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .styles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

    .style {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      background: var(--hover);
      border: 1px solid transparent;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .style.on { border-color: #5a5aff; background: rgba(90, 90, 255, 0.14); }
    .style svg { width: 26px; height: 12px; display: block; flex: none; }

    /* page thumbnails */
    .pages {
      position: absolute;
      top: 96px;
      right: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 20px;
    }

    .page {
      display: grid;
      place-items: end center;
      width: 56px;
      height: 74px;
      padding-bottom: 5px;
      border-radius: 9px;
      background: var(--paper);
      border: 1px solid var(--rule);
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .page.on {
      border-color: #5a5aff;
      color: var(--accent-ui);
      box-shadow: 0 0 0 2px rgba(90, 90, 255, 0.3);
    }

    .page-add {
      display: grid;
      place-items: center;
      width: 56px;
      height: 44px;
      border: 1px dashed var(--rule);
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .page-add svg { width: 18px; height: 18px; display: block; }
  </style>
</helmet>

<div class="stage" data-theme="{{theme}}">
  <div class="canvas"></div>
  <div class="dots"></div>

  <svg viewBox="0 0 1040 660" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5">
    <path d="M470 330 C 540 240, 610 400, 690 310 S 810 250, 880 340" fill="none" stroke="#5a5aff" stroke-width="7" stroke-linecap="round" opacity="0.5"></path>
    <path d="M500 400 C 560 380, 630 415, 700 390" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.26" color="var(--ink)"></path>
  </svg>

  <div class="top glass">
    <div class="crumbs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a1.7 1.7 0 0 0-1.7-1.7H5.5A1.5 1.5 0 0 1 4 15.8z"></path><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a1.7 1.7 0 0 1 1.7-1.7h4.8a1.5 1.5 0 0 0 1.5-1.5z"></path></svg>
      Physics
      <span class="dim">/</span>
      <span class="dim">Chapter 4 — Optics</span>
    </div>

    <div class="top-actions">
      <button class="ghost" type="button" title="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h9a5 5 0 0 1 0 10H8"></path><path d="M8 5L4 9l4 4"></path></svg>
      </button>
      <button class="ghost" type="button" title="Redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9h-9a5 5 0 0 0 0 10h5"></path><path d="M16 5l4 4-4 4"></path></svg>
      </button>
      <button class="ghost" type="button" title="Focus timer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9.5V13l2.5 1.5"></path><path d="M9.5 3h5"></path></svg>
      </button>
      <button class="cta" type="button">Export</button>
    </div>
  </div>

  <div class="rail glass">
    <button class="{{cls.select}}" type="button" onClick="{{pick.select}}" title="Select">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3l12 9-5 .9 2.6 5.2-2.2 1-2.6-5.2L7 17z"></path></svg>
    </button>
    <button class="{{cls.pen}}" type="button" onClick="{{pick.pen}}" title="Pen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l3.6-1 9.4-9.4a2.2 2.2 0 0 0-3.1-3.1L5 15.4z"></path><path d="M13.8 6.6l3.1 3.1"></path></svg>
    </button>
    <button class="{{cls.highlight}}" type="button" onClick="{{pick.highlight}}" title="Highlighter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.9l3.9 3.9-7 7-5 1.1 1.1-5z"></path><path d="M4 20.5h10"></path></svg>
    </button>
    <button class="{{cls.eraser}}" type="button" onClick="{{pick.eraser}}" title="Eraser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.4 5.1l3.9 3.9a1.6 1.6 0 0 1 0 2.3l-6.1 6.1H8.3l-3-3a1.6 1.6 0 0 1 0-2.3l7.8-7.8a1.6 1.6 0 0 1 2.3 0z"></path><path d="M8.6 19.5H19.5"></path></svg>
    </button>

    <div class="rail-rule"></div>

    <button class="{{cls.shape}}" type="button" onClick="{{pick.shape}}" title="Shape">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9.5" cy="9.5" r="5"></circle><rect x="10.5" y="10.5" width="9" height="9" rx="2"></rect></svg>
    </button>
    <button class="{{cls.text}}" type="button" onClick="{{pick.text}}" title="Text">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5h14"></path><path d="M12 5v14"></path><path d="M9 19h6"></path></svg>
    </button>
    <button class="{{cls.tiles}}" type="button" onClick="{{pick.tiles}}" title="Algebra tiles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"></rect><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6"></rect><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"></rect></svg>
    </button>
    <button class="{{cls.media}}" type="button" onClick="{{pick.media}}" title="Import">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"></rect><path d="M3.5 15.5l4.5-4 4 3.5 3.5-3 4.5 4"></path></svg>
    </button>
  </div>

  <div class="panel glass">
    <div class="panel-head">
      <div class="panel-title">{{toolName}}</div>
      <div class="kbd">{{toolKey}}</div>
    </div>

    <sc-if value="{{showColor}}" hint-placeholder-val="{{ true }}">
      <div class="section">
        <div class="label">Colour</div>
        <div class="swatches">
          <button class="sw on" type="button" title="Ink"><i style="background: var(--ink-swatch)"></i></button>
          <button class="sw" type="button" title="Indigo"><i style="background: #5a5aff"></i></button>
          <button class="sw" type="button" title="Cyan"><i style="background: #67e8f9"></i></button>
          <button class="sw" type="button" title="Green"><i style="background: #86efac"></i></button>
          <button class="sw" type="button" title="Yellow"><i style="background: #facc15"></i></button>
          <button class="sw" type="button" title="Rose"><i style="background: #fb7185"></i></button>
        </div>
      </div>
    </sc-if>

    <div class="section">
      <div class="row">
        <div class="label" style="margin: 0">Size</div>
        <div class="val">{{sizeLabel}}</div>
      </div>
      <div class="sizerow">
        <div class="track">
          <div class="fill"></div>
          <div class="knob"></div>
        </div>
      </div>
    </div>

    <sc-if value="{{showStyle}}" hint-placeholder-val="{{ true }}">
      <div class="section">
        <div class="label">Nib</div>
        <div class="styles">
          <button class="style on" type="button">
            <svg viewBox="0 0 30 12" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M2 9c6-7 11 3 17-3" stroke-width="1.6"></path></svg>
            Fountain
          </button>
          <button class="style" type="button">
            <svg viewBox="0 0 30 12" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M2 9c6-7 11 3 17-3" stroke-width="4.4" opacity="0.75"></path></svg>
            Brush
          </button>
          <button class="style" type="button">
            <svg viewBox="0 0 30 12" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M2 9c6-7 11 3 17-3" stroke-width="3"></path></svg>
            Gel
          </button>
          <button class="style" type="button">
            <svg viewBox="0 0 30 12" fill="none" stroke="currentColor" stroke-linecap="butt"><path d="M2 9c6-7 11 3 17-3" stroke-width="2.6" stroke-dasharray="0.1 0" transform="skewX(-18)"></path></svg>
            Calligraphy
          </button>
        </div>
      </div>
    </sc-if>
  </div>

  <div class="pages glass">
    <button class="page on" type="button">1</button>
    <button class="page" type="button">2</button>
    <button class="page" type="button">3</button>
    <button class="page-add" type="button" title="Add page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const ids = ['select', 'pen', 'highlight', 'eraser', 'shape', 'text', 'tiles', 'media'];
    const meta = {
      select: { name: 'Select', key: 'V', color: false, style: false, size: 'None' },
      pen: { name: 'Pen', key: 'P', color: true, style: true, size: '4 px' },
      highlight: { name: 'Highlighter', key: 'H', color: true, style: false, size: '18 px' },
      eraser: { name: 'Eraser', key: 'E', color: false, style: false, size: '24 px' },
      shape: { name: 'Shape', key: 'S', color: true, style: false, size: '3 px' },
      text: { name: 'Text', key: 'T', color: true, style: false, size: '16 px' },
      tiles: { name: 'Algebra tiles', key: 'A', color: true, style: false, size: 'Medium' },
      media: { name: 'Import', key: 'I', color: false, style: false, size: 'Fit page' }
    };

    const active = (this.state && this.state.active) || 'pen';
    const cls = {};
    const pick = {};

    ids.forEach((id) => {
      cls[id] = id === active ? 'tool is-active' : 'tool';
      pick[id] = () => this.setState({ active: id });
    });

    const m = meta[active] || meta.pen;

    return {
      theme: this.props.theme ?? 'dark',
      cls,
      pick,
      toolName: m.name,
      toolKey: m.key,
      sizeLabel: m.size,
      showColor: m.color,
      showStyle: m.style
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5a5aff; }
    a:hover { color: #4444d6; }

    .stage {
      position: relative;
      width: 1040px;
      height: 660px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--txt);
    }

    .stage[data-theme="dark"] {
      --bg-a: #0c0f15;
      --bg-b: #06080d;
      --halo: rgba(86, 101, 146, 0.18);
      --dot: rgba(255, 255, 255, 0.13);
      --chrome: rgba(20, 22, 30, 0.72);
      --chrome-brd: rgba(255, 255, 255, 0.10);
      --chrome-hi: rgba(255, 255, 255, 0.14);
      --pop: rgba(17, 19, 26, 0.92);
      --txt: #f8fafc;
      --muted: rgba(248, 250, 252, 0.66);
      --hover: rgba(255, 255, 255, 0.07);
      --rule: rgba(255, 255, 255, 0.12);
      --ink: #f1f5f9;
      --ink-swatch: #f8fafc;
      --knob-brd: rgba(0, 0, 0, 0.2);
      --drop: 0 24px 60px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.35);
    }

    .stage[data-theme="light"] {
      --bg-a: #f5f7fb;
      --bg-b: #e8edf5;
      --halo: rgba(157, 176, 212, 0.38);
      --dot: rgba(15, 23, 42, 0.11);
      --chrome: rgba(255, 255, 255, 0.82);
      --chrome-brd: rgba(15, 23, 42, 0.08);
      --chrome-hi: rgba(255, 255, 255, 0.9);
      --pop: rgba(255, 255, 255, 0.94);
      --txt: #0f172a;
      --muted: rgba(15, 23, 42, 0.74);
      --hover: rgba(15, 23, 42, 0.05);
      --rule: rgba(15, 23, 42, 0.1);
      --ink: #1e293b;
      --ink-swatch: #0f172a;
      --knob-brd: rgba(15, 23, 42, 0.22);
      --drop: 0 24px 50px rgba(100, 116, 145, 0.22), 0 4px 12px rgba(100, 116, 145, 0.12);
    }

    .canvas {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top center, var(--halo), transparent 34%),
        linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
    }

    .dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--dot) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.36;
    }

    .glass {
      background: var(--chrome);
      border: 1px solid var(--chrome-brd);
      backdrop-filter: blur(22px) saturate(160%);
      box-shadow: var(--drop), inset 0 1px 0 var(--chrome-hi);
    }

    .doc {
      position: absolute;
      top: 22px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px 6px 6px;
      border-radius: 18px;
    }

    .doc-name { font-size: 0.88rem; font-weight: 800; letter-spacing: -0.01em; }

    /* --- floating command bar --- */
    .bar {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px;
      border-radius: 20px;
    }

    .cluster { display: flex; align-items: center; gap: 2px; }

    .rule {
      width: 1px;
      height: 26px;
      margin: 0 6px;
      background: var(--rule);
      border-radius: 1px;
    }

    .tool {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tool:hover { background: var(--hover); transform: translateY(-1px); }

    .tool.is-active {
      background: linear-gradient(180deg, #6f6fff, #4f4fe6);
      color: #fff;
      box-shadow:
        0 6px 18px rgba(90, 90, 255, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .tool svg { width: 22px; height: 22px; display: block; }

    /* --- options popover --- */
    .pop {
      position: absolute;
      top: 94px;
      left: 50%;
      transform: translateX(-50%);
      width: 336px;
      padding: 16px;
      border-radius: 20px;
    }

    .pop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .pop-title { font-size: 0.98rem; font-weight: 800; letter-spacing: -0.015em; }

    .kbd {
      padding: 4px 8px;
      border-radius: 7px;
      background: var(--hover);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
    }

    .label {
      margin-bottom: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section + .section { margin-top: 14px; }

    .swatches { display: flex; gap: 4px; }

    .sw {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .sw i {
      display: block;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sw:hover i { transform: scale(1.14); }
    .sw.on { background: rgba(90, 90, 255, 0.14); }
    .sw.on i { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2), 0 0 0 2px #5a5aff; }

    .sizerow { display: flex; align-items: center; gap: 14px; height: 44px; }

    .track {
      position: relative;
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: var(--hover);
    }

    .fill {
      position: absolute;
      inset: 0 42% 0 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #6f6fff, #5a5aff);
    }

    .knob {
      position: absolute;
      top: 50%;
      left: 58%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--knob-brd);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .val { color: var(--muted); font-size: 0.8rem; font-weight: 700; min-width: 42px; text-align: right; }

    .styles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

    .style {
      display: grid;
      place-items: center;
      gap: 6px;
      min-height: 62px;
      padding: 8px;
      border-radius: 13px;
      background: var(--hover);
      border: 1px solid transparent;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 0.73rem;
      font-weight: 700;
    }

    .style.on { border-color: #5a5aff; background: rgba(90, 90, 255, 0.14); }
    .style svg { width: 34px; height: 12px; display: block; }
  </style>
</helmet>

<div class="stage" data-theme="{{theme}}">
  <div class="canvas"></div>
  <div class="dots"></div>

  <svg viewBox="0 0 1040 660" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.5">
    <path d="M250 430 C 330 330, 400 500, 480 400 S 620 320, 700 420" fill="none" stroke="#5a5aff" stroke-width="7" stroke-linecap="round" opacity="0.55"></path>
    <path d="M300 490 C 360 470, 430 505, 500 480" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.28" color="var(--ink)"></path>
  </svg>

  <div class="doc glass">
    <button class="tool" type="button" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg>
    </button>
    <div class="doc-name">Physics · Ch 4</div>
  </div>

  <div class="bar glass">
    <div class="cluster">
      <button class="{{cls.select}}" type="button" onClick="{{pick.select}}" title="Select">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3l12 9-5 .9 2.6 5.2-2.2 1-2.6-5.2L7 17z"></path></svg>
      </button>
      <button class="{{cls.pen}}" type="button" onClick="{{pick.pen}}" title="Pen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l3.6-1 9.4-9.4a2.2 2.2 0 0 0-3.1-3.1L5 15.4z"></path><path d="M13.8 6.6l3.1 3.1"></path></svg>
      </button>
      <button class="{{cls.highlight}}" type="button" onClick="{{pick.highlight}}" title="Highlighter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.9l3.9 3.9-7 7-5 1.1 1.1-5z"></path><path d="M4 20.5h10"></path></svg>
      </button>
      <button class="{{cls.eraser}}" type="button" onClick="{{pick.eraser}}" title="Eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15.4 5.1l3.9 3.9a1.6 1.6 0 0 1 0 2.3l-6.1 6.1H8.3l-3-3a1.6 1.6 0 0 1 0-2.3l7.8-7.8a1.6 1.6 0 0 1 2.3 0z"></path><path d="M8.6 19.5H19.5"></path></svg>
      </button>
    </div>

    <div class="rule"></div>

    <div class="cluster">
      <button class="{{cls.shape}}" type="button" onClick="{{pick.shape}}" title="Shape">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9.5" cy="9.5" r="5"></circle><rect x="10.5" y="10.5" width="9" height="9" rx="2"></rect></svg>
      </button>
      <button class="{{cls.text}}" type="button" onClick="{{pick.text}}" title="Text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5h14"></path><path d="M12 5v14"></path><path d="M9 19h6"></path></svg>
      </button>
      <button class="{{cls.tiles}}" type="button" onClick="{{pick.tiles}}" title="Algebra tiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.6"></rect><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.6"></rect><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.6"></rect></svg>
      </button>
      <button class="{{cls.media}}" type="button" onClick="{{pick.media}}" title="Import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"></rect><path d="M3.5 15.5l4.5-4 4 3.5 3.5-3 4.5 4"></path></svg>
      </button>
    </div>

    <div class="rule"></div>

    <div class="cluster">
      <button class="tool" type="button" title="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h9a5 5 0 0 1 0 10H8"></path><path d="M8 5L4 9l4 4"></path></svg>
      </button>
      <button class="tool" type="button" title="Redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9h-9a5 5 0 0 0 0 10h5"></path><path d="M16 5l4 4-4 4"></path></svg>
      </button>
      <button class="tool" type="button" title="Export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"></path><path d="M8 8l4-4 4 4"></path><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
      </button>
    </div>
  </div>

  <div class="pop glass">
    <div class="pop-head">
      <div class="pop-title">{{toolName}}</div>
      <div class="kbd">{{toolKey}}</div>
    </div>

    <sc-if value="{{showColor}}" hint-placeholder-val="{{ true }}">
      <div class="section">
        <div class="label">Colour</div>
        <div class="swatches">
          <button class="sw on" type="button" title="Ink"><i style="background: var(--ink-swatch)"></i></button>
          <button class="sw" type="button" title="Indigo"><i style="background: #5a5aff"></i></button>
          <button class="sw" type="button" title="Cyan"><i style="background: #67e8f9"></i></button>
          <button class="sw" type="button" title="Green"><i style="background: #86efac"></i></button>
          <button class="sw" type="button" title="Yellow"><i style="background: #facc15"></i></button>
          <button class="sw" type="button" title="Rose"><i style="background: #fb7185"></i></button>
        </div>
      </div>
    </sc-if>

    <div class="section">
      <div class="label">Size</div>
      <div class="sizerow">
        <div class="track">
          <div class="fill"></div>
          <div class="knob"></div>
        </div>
        <div class="val">{{sizeLabel}}</div>
      </div>
    </div>

    <sc-if value="{{showStyle}}" hint-placeholder-val="{{ true }}">
      <div class="section">
        <div class="label">Nib</div>
        <div class="styles">
          <button class="style on" type="button">
            <svg viewBox="0 0 40 14" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 10c8-8 14 4 22-2" stroke-width="2"></path></svg>
            Fountain
          </button>
          <button class="style" type="button">
            <svg viewBox="0 0 40 14" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 10c8-8 14 4 22-2" stroke-width="5" opacity="0.75"></path></svg>
            Brush
          </button>
          <button class="style" type="button">
            <svg viewBox="0 0 40 14" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M3 10c8-8 14 4 22-2" stroke-width="3.4"></path></svg>
            Gel
          </button>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    const ids = ['select', 'pen', 'highlight', 'eraser', 'shape', 'text', 'tiles', 'media'];
    const meta = {
      select: { name: 'Select', key: 'V', color: false, style: false, size: 'None' },
      pen: { name: 'Pen', key: 'P', color: true, style: true, size: '4 px' },
      highlight: { name: 'Highlighter', key: 'H', color: true, style: false, size: '18 px' },
      eraser: { name: 'Eraser', key: 'E', color: false, style: false, size: '24 px' },
      shape: { name: 'Shape', key: 'S', color: true, style: false, size: '3 px' },
      text: { name: 'Text', key: 'T', color: true, style: false, size: '16 px' },
      tiles: { name: 'Algebra tiles', key: 'A', color: true, style: false, size: 'Medium' },
      media: { name: 'Import', key: 'I', color: false, style: false, size: 'Fit page' }
    };

    const active = (this.state && this.state.active) || 'pen';
    const cls = {};
    const pick = {};

    ids.forEach((id) => {
      cls[id] = id === active ? 'tool is-active' : 'tool';
      pick[id] = () => this.setState({ active: id });
    });

    const m = meta[active] || meta.pen;

    return {
      theme: this.props.theme ?? 'dark',
      cls,
      pick,
      toolName: m.name,
      toolKey: m.key,
      sizeLabel: m.size,
      showColor: m.color,
      showStyle: m.style
    };
  }
}
</script>
</body>
</html>
